<!DOCTYPE HTML>

<html>
	<head>
		<title>Story Generator - Edward Mallia</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
	</head>
	<body class="is-preload">
		<!-- Header -->
		<section id="header">
			<div class="inner">
				<span class="icon solid major fa-book"></span>
				<h1>Story <strong>Generator</strong><br />
				Create unique stories with AI</h1>
				<p>Generate compelling narratives by selecting tags,<br />
				choosing styles, and customising your prompts.</p>
				<ul class="actions special">
					<li><a href="#storyform" class="button scrolly">Start Creating</a></li>
				</ul>
			</div>
		</section>

		<!-- Story Generator Form -->
		<section id="storyform" class="main style1">
			<div class="container">
				<h1 class="align-center"><strong>Create</strong> Your Story</h1>
				<form id="storyForm" class="form-style">
					<div class="row gtr-uniform">
						<div class="col-6 col-12-xsmall">
							<label for="age-target">Target Age Group</label>
							<select name="age-target" id="age-target">
								<option value="">- Random -</option>
								<option value="children">Children</option>
								<option value="teenager">Teenager</option>
								<option value="adult">Adult</option>
							</select>
						</div>
						<div class="col-6 col-12-xsmall">
							<label for="story-length">Story Length</label>
							<select name="story-length" id="story-length">
								<option value="">- Random -</option>
								<option value="short (2-3 parts)">Short Story</option>
								<option value="medium (3-5 parts)">Medium Story</option>
								<option value="long (5-8 parts)">Long Story</option>
							</select>
						</div>
						<div class="col-6 col-12-xsmall">
							<label for="genre">Genre</label>
							<select name="genre" id="genre">
								<option value="">- Random -</option>
								<option value="fantasy">Fantasy</option>
								<option value="mystery">Mystery</option>
								<option value="romance">Romance</option>
								<option value="sci-fi">Science Fiction</option>
								<option value="adventure">Adventure</option>
								<option value="horror">Horror</option>
								<option value="comedy">Comedy</option>
								<option value="drama">Drama</option>
								<option value="educational">Educational</option>
							</select>
						</div>
						<div class="col-6 col-12-xsmall">
							<label for="story-theme">Story Theme</label>
							<select name="story-theme" id="story-theme">
								<option value="">- Random -</option>
								<option value="coming-of-age">Coming of Age</option>
								<option value="good-vs-evil">Good vs Evil</option>
								<option value="love-and-loss">Love and Loss</option>
								<option value="survival">Survival</option>
								<option value="discovery">Discovery</option>
								<option value="happily-ever-after">Happily Ever After</option>
								<option value="fairytale">Fairytale</option>
							</select>
						</div>
						<div class="col-6 col-12-xsmall">
							<label for="setting">Setting</label>
							<select name="setting" id="setting">
								<option value="">- Random -</option>
								<option value="urban">Urban City</option>
								<option value="rural">Countryside</option>
								<option value="house">House</option>
								<option value="fantasy-realm">Fantasy Realm</option>
								<option value="space">Space/Other Planets</option>
								<option value="underwater">Underwater World</option>
								<option value="mountains">Mountain Range</option>
								<option value="desert">Desert</option>
								<option value="forest">Forest</option>
								<option value="snowy-landscape">Snowy Landscape</option>
							</select>
						</div>
						<div class="col-6 col-12-xsmall">
							<label for="protagonist">Protagonist Type</label>
							<select name="protagonist" id="protagonist">
								<option value="">- Random -</option>
								<option value="human">Human</option>
								<option value="animal">Animal</option>
								<option value="mythical">Mythical Creature</option>
								<option value="robot">Robot/AI</option>
								<option value="supernatural">Supernatural Being</option>
							</select>
						</div>
						<div class="col-12">
							<label for="prompt">Additional Details</label>
							<textarea name="prompt" id="prompt" maxlength="100" placeholder="Add any additional details or prompts here..."></textarea>
						</div>
						<div class="col-12">
							<ul class="actions special">
								<li><input id="storyButton" type="submit" value="Generate Story" class="button primary" /></li>
							</ul>
						</div>
					</div>
				</form>
			</div>
		</section>

		<!-- Footer -->
		<section id="footer">
			<div id="footeradjust">
				<div id="footerline"></div>
				<ul class="actions special">
					<li><a href="#adjustform" class="button scrolly">CONTINUE ADJUSTING</a></li>
				</ul>
			</div>
		</section>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
		<script type="module" src="assets/js/storyGenerator.js" defer></script>
	</body>
</html>
